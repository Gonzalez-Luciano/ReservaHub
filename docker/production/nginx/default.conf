# Mapa obligatorio para el upgrade a WebSocket: sin él, una petición HTTP
# normal hacia Reverb heredaría `Connection: upgrade` y fallaría.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Fuente única del esquema para TODO lo que este contenedor reenvía (PHP-FPM
# y Reverb): si algo que ya llegó a `web` declaró X-Forwarded-Proto, se
# conserva ese valor (viene de un proxy real que ya terminó TLS más afuera);
# si no hay nada declarado, se usa el esquema de la conexión que nginx mismo
# recibió ($scheme) porque este contenedor es el borde real. Con
# WEB_BIND=127.0.0.1 (default de compose.production.yaml), lo único que puede
# conectarse acá es un proceso del mismo VPS — el proxy de host o
# `cloudflared` — así que confiar en lo que ya venga declarado es seguro
# mientras ese binding se mantenga.
map $http_x_forwarded_proto $reservahub_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Host reenviado a PHP-FPM. `$http_host` (el header Host crudo) y NO `$host`:
# nginx normaliza `$host` quitándole el puerto, así que con `$host` Laravel
# reconstruye toda URL generada sin él y el navegador termina pidiendo los
# assets a `http://localhost/build/...` en vez de `:8280` — CORS los bloquea y
# el frontend entero no carga. Invisible en el deployment real (443 es el
# puerto por defecto de https y se omite igual), pero rompe cualquier
# despliegue en un puerto no estándar, incluida la verificación local del
# stack productivo que exige §12.28. `$http_host` queda vacío si el cliente no
# manda Host (HTTP/1.0), y ahí se cae a `$host`, que siempre tiene valor.
map $http_host $reservahub_forwarded_host {
    default $http_host;
    ''      $host;
}

# Resolución diferida en lugar de `upstream {}` estático: un bloque `upstream`
# resuelve el hostname UNA sola vez, al cargar la config. Eso falla en un
# `docker run` aislado sin red de Docker (no hay nada que resolver "app" o
# "reverb"), y en el compose real es igual de frágil: si `app`/`reverb` no
# están resolvibles justo cuando arranca `web` (timing de reinicio, un
# hipo transitorio de red), nginx no arranca en absoluto, no solo falla la
# petición. El resolver embebido de Docker (127.0.0.11) resuelve en cada
# request con TTL corto, así que un servicio que tarda en aparecer no tumba
# a `web` entero.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ---- Reverb: WebSocket ----
    # `/app/{key}` es el handshake del protocolo Pusher. HTTP/1.1 y las
    # cabeceras de upgrade son obligatorias; sin ellas el navegador recibe
    # un 400 y Echo reintenta en bucle.
    location /app {
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $reservahub_forwarded_proto;

        # Una conexión de tiempo real está inactiva la mayor parte del tiempo.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Reverb: API de publicación (HTTP normal, no WebSocket) ----
    # La usa el servidor para publicar eventos. Verificado: responde 401 sin
    # firma válida, así que no queda abierta por estar enrutada.
    location /apps {
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $reservahub_forwarded_proto;
    }

    # `/broadcasting/auth` NO está acá a propósito: es una petición de la
    # aplicación Laravel, autenticada por cookie de sesión y middleware `web`.
    # Cae en el bloque general de abajo.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Los assets de Vite llevan hash en el nombre: son inmutables.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;

        # Sin esto, Laravel nunca ve X-Forwarded-Proto/For/Host de forma
        # consistente: `fastcgi_params` no los agrega por nombre, y
        # `fastcgi_pass_request_headers on` (el default) reenviaría el valor
        # que haya mandado quien conectó a `web` tal cual, sin normalizar. Acá
        # se fija explícitamente con la misma fuente que ya usan los bloques
        # de Reverb arriba, para una sola decisión de confianza en las tres
        # rutas.
        fastcgi_param HTTP_X_FORWARDED_PROTO $reservahub_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $reservahub_forwarded_host;
    }

    # Nada de archivos ocultos, y en particular nunca un .env servido como
    # estático si alguna vez apareciera en el document root.
    location ~ /\. {
        deny all;
    }
}
